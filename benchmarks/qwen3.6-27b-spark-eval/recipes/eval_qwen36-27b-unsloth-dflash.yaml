recipe_version: '1'
name: eval-Qwen3.6-27B-NVFP4-unsloth-DFlash
description: BENCH ONLY - vLLM serving unsloth/Qwen3.6-27B-NVFP4 + DFlash drafter k=10 - 16K ctx, no prefix cache, qwen3_xml parser
model: unsloth/Qwen3.6-27B-NVFP4

container: vllm-node-tf5

solo_only: true

build_args:
  - --tf5

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 16384
  max_num_batched_tokens: 16384
  max_num_seqs: 3
  served-model-name: qwen3.6-27b-vision
  chat_template: /root/.cache/huggingface/templates/qwen3.6/chat_template.jinja

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  TORCH_MATMUL_PRECISION: high
  NVIDIA_FORWARD_COMPAT: 1
  NVIDIA_DISABLE_REQUIRE: 1
  HF_HUB_OFFLINE: 1
  TRANSFORMERS_OFFLINE: 1

command: |
  vllm serve unsloth/Qwen3.6-27B-NVFP4 \
    --served-model-name {served-model-name} \
    --host {host} --port {port} \
    -tp {tensor_parallel} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --dtype bfloat16 \
    --kv-cache-dtype auto \
    --enable-auto-tool-choice \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --chat-template {chat_template} \
    --enable-chunked-prefill \
    --no-enable-prefix-caching \
    --trust-remote-code \
    --load-format fastsafetensors \
    --override-generation-config '{{"temperature": 0}}' \
    --speculative-config '{{"method": "dflash", "model": "z-lab/Qwen3.6-27B-DFlash", "num_speculative_tokens": 10}}' \
    --attention-backend flash_attn \
    --limit-mm-per-prompt '{{"image": 4, "video": 2}}' \
    --mm-encoder-tp-mode data \
    --mm-processor-cache-type shm
